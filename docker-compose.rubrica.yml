# Compose >= 2.24.4. Usar junto ao principal; portas locais sem colisao com 80/443.
services:
  backend:
    ports: !reset []
  nginx:
    ports: !override
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
    volumes:
      - ${INFRA_NGINX_CONF:?Execute prepare-infra-check.ps1}:/etc/nginx/conf.d/default.conf:ro
